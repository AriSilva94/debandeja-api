name: Build and push Docker image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Test
        run: npm test

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn about new migrations
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          new_migrations=$(git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- prisma/migrations | grep migration.sql || true)
          if [ -n "$new_migrations" ]; then
            echo "::warning title=Migration nova no deploy::Faça backup do banco de ${{ github.ref_name == 'main' && 'prd' || 'dev' }} antes. Migrations: $(echo $new_migrations | tr '\n' ' ')"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'develop' }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deploy (develop)
        if: github.ref_name == 'develop'
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEV_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_DEV_WEBHOOK_URL secret not set, skipping."
            exit 0
          fi
          curl -fsS -X GET "$WEBHOOK_URL"

      - name: Trigger Dokploy deploy (main)
        if: github.ref_name == 'main'
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_PROD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_PROD_WEBHOOK_URL secret not set, skipping."
            exit 0
          fi
          curl -fsS -X GET "$WEBHOOK_URL"
